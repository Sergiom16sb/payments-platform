name: payments-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: payments-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-payments}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-payments}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - payments-net

  api:
    image: payments-api:dev
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: payments-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-payments}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars-please}
      JWT_ISSUER: ${JWT_ISSUER:-payments-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-payments-client}
      JWT_ACCESS_TOKEN_EXPIRES_IN: ${JWT_ACCESS_TOKEN_EXPIRES_IN:-15m}
      JWT_REFRESH_TOKEN_EXPIRES_IN: ${JWT_REFRESH_TOKEN_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      PAYMENTS_PROCESSOR_URL: ${PAYMENTS_PROCESSOR_URL:-http://processor:8000}
      PAYMENTS_PROCESSOR_TIMEOUT_MS: ${PAYMENTS_PROCESSOR_TIMEOUT_MS:-5000}
      PAYMENTS_PROCESSOR_MAX_RETRIES: ${PAYMENTS_PROCESSOR_MAX_RETRIES:-3}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      processor:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - bun -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - payments-net

  processor:
    image: payments-processor:dev
    build:
      context: ./apps/processor
      dockerfile: Dockerfile
    container_name: payments-processor
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PROCESSOR_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3); sys.exit(0 if r.status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - payments-net

volumes:
  postgres_data:
    name: payments_postgres_data

networks:
  payments-net:
    name: payments-net
    driver: bridge